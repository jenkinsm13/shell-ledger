[project]
name = "shell-ledger"
version = "0.1.0"
description = "A pre-registered forecasting loop for insider dollar volume: a golden-ratio shell model against plain baselines."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
shell-ledger = "shell_ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shell_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
